<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件回收站管理</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --card-bg: #16213e;
            --border: #2a3a5e;
            --text: #e0e0e0;
            --text-secondary: #a0a0b0;
            --accent: #4fc3f7;
            --danger: #ef5350;
            --success: #66bb6a;
            --warning: #ffa726;
            --hover: #1e3050;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 20px; color: var(--accent); }
        .header-right { display: flex; gap: 12px; align-items: center; }

        .container { max-width: 1200px; margin: 0 auto; padding: 24px 32px; }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }
        .stat-card .label { font-size: 13px; color: var(--text-secondary); }
        .stat-card .value { font-size: 28px; font-weight: 700; color: var(--accent); margin-top: 4px; }
        .stat-card .sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            align-items: center;
        }
        .search-box {
            flex: 1;
            padding: 8px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 14px;
            outline: none;
        }
        .search-box:focus { border-color: var(--accent); }

        .page-size-select {
            padding: 8px 12px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        .page-size-select:focus { border-color: var(--accent); }

        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: #1a1a2e; }
        .btn-restore { background: var(--success); color: white; padding: 4px 12px; font-size: 12px; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .file-list {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        .file-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }
        .file-item:last-child { border-bottom: none; }
        .file-item:hover { background: var(--hover); }

        .file-icon {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            margin-right: 12px;
        }
        .file-info { flex: 1; min-width: 0; }
        .file-name {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-path {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-meta {
            display: flex;
            gap: 20px;
            font-size: 12px;
            color: var(--text-secondary);
            flex-shrink: 0;
            margin-right: 12px;
        }
        .file-meta span { white-space: nowrap; }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }

        /* 分页控件 */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            margin-top: 8px;
        }
        .pagination-info {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .pagination-controls {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .page-btn {
            min-width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            padding: 0 8px;
        }
        .page-btn:hover:not(:disabled):not(.active) {
            background: var(--hover);
            border-color: var(--accent);
        }
        .page-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg);
            font-weight: 600;
        }
        .page-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .page-ellipsis {
            color: var(--text-secondary);
            font-size: 13px;
            padding: 0 4px;
        }

        .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .loading-spinner {
            display: inline-block;
            width: 24px; height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            pointer-events: none;
        }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .confirm-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex; align-items: center; justify-content: center;
            z-index: 999;
        }
        .confirm-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            max-width: 400px;
            text-align: center;
        }
        .confirm-box p { margin-bottom: 20px; font-size: 15px; }
        .confirm-box .actions { display: flex; gap: 12px; justify-content: center; }

        .footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 12px;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🗑️ 共享文件回收站</h1>
        <div class="header-right">
            <span id="lastRefresh" style="color: var(--text-secondary); font-size: 12px;"></span>
            <button class="btn" style="background: var(--border); color: var(--text);" onclick="refresh()">刷新</button>
            <button class="btn btn-danger" onclick="showEmptyConfirm()">清空回收站</button>
        </div>
    </div>

    <div class="container">
        <div class="stats">
            <div class="stat-card">
                <div class="label">回收站文件数</div>
                <div class="value" id="statCount">-</div>
                <div class="sub">已删除并被保护的文件</div>
            </div>
            <div class="stat-card">
                <div class="label">占用空间</div>
                <div class="value" id="statSize">-</div>
                <div class="sub" id="statBackup"></div>
            </div>
            <div class="stat-card">
                <div class="label">保留期限</div>
                <div class="value" style="font-size: 22px;">30 天</div>
                <div class="sub">超期自动清理</div>
            </div>
        </div>

        <div class="toolbar">
            <input type="text" class="search-box" placeholder="搜索文件名或路径..." id="searchInput">
            <select class="page-size-select" id="pageSizeSelect" title="每页显示数量">
                <option value="10">10 条/页</option>
                <option value="20" selected>20 条/页</option>
                <option value="50">50 条/页</option>
                <option value="100">100 条/页</option>
            </select>
            <span style="font-size: 13px; color: var(--text-secondary);">
                共 <strong id="fileCount">0</strong> 个文件
            </span>
        </div>

        <div class="file-list" id="fileList">
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <div>加载中...</div>
            </div>
        </div>

        <div class="pagination" id="pagination" style="display:none;">
            <div class="pagination-info" id="paginationInfo"></div>
            <div class="pagination-controls" id="paginationControls"></div>
        </div>
    </div>

    <div class="footer">
        文件回收站守护程序 · 所有远程删除操作都会被记录并可恢复
    </div>

    <!-- Toast -->
    <div id="toast" class="toast" style="display:none;"></div>

    <!-- 确认对话框 -->
    <div id="confirmOverlay" class="confirm-overlay" style="display:none;">
        <div class="confirm-box">
            <p>确定要清空回收站吗？<br><strong>此操作不可逆！</strong></p>
            <div class="actions">
                <button class="btn" style="background: var(--border); color: var(--text);" onclick="hideConfirm()">取消</button>
                <button class="btn btn-danger" onclick="emptyRecycle()">确认清空</button>
            </div>
        </div>
    </div>

    <script>
        // ── 分页状态 ──────────────────────────────────────────
        var currentPage = 1;
        var pageSize = 20;
        var totalPages = 1;
        var searchTimer = null;

        // ── 工具函数 ──────────────────────────────────────────
        function showToast(msg, type) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast toast-' + type;
            t.style.display = 'block';
            setTimeout(function() { t.style.display = 'none'; }, 3000);
        }

        function showEmptyConfirm() {
            document.getElementById('confirmOverlay').style.display = 'flex';
        }
        function hideConfirm() {
            document.getElementById('confirmOverlay').style.display = 'none';
        }

        function getFileIcon(f) {
            if (f.is_directory) return '📁';
            var p = f.relative_path.toLowerCase();
            if (p.endsWith('.xlsx') || p.endsWith('.xls')) return '📊';
            if (p.endsWith('.docx') || p.endsWith('.doc')) return '📝';
            if (p.endsWith('.pdf')) return '📕';
            if (p.endsWith('.jpg') || p.endsWith('.png') || p.endsWith('.jpeg')) return '🖼️';
            return '📄';
        }

        function getFileName(f) {
            var parts = f.relative_path.replace(/\\/g, '/').split('/');
            return parts[parts.length - 1] || f.relative_path;
        }

        // ── 加载文件列表 ──────────────────────────────────────
        function loadFiles() {
            var search = document.getElementById('searchInput').value;
            var params = new URLSearchParams({
                page: currentPage,
                page_size: pageSize,
                search: search
            });

            document.getElementById('fileList').innerHTML =
                '<div class="loading-state"><div class="loading-spinner"></div><div>加载中...</div></div>';

            fetch('/api/files?' + params)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    totalPages = data.total_pages;
                    currentPage = data.page;
                    renderFileList(data.files);
                    renderPagination(data.total, data.page, data.total_pages);
                    document.getElementById('fileCount').textContent = data.total;
                })
                .catch(function(err) {
                    document.getElementById('fileList').innerHTML =
                        '<div class="empty-state"><div class="icon">⚠️</div><div>加载失败: ' + err + '</div></div>';
                });
        }

        // ── 渲染文件列表 ──────────────────────────────────────
        function renderFileList(files) {
            var container = document.getElementById('fileList');
            if (!files || files.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><div>回收站为空，暂无已删除文件</div></div>';
                return;
            }

            var html = '';
            for (var i = 0; i < files.length; i++) {
                var f = files[i];
                var name = getFileName(f);
                html += '<div class="file-item" data-search="' + escapeAttr(f.relative_path) + '">'
                    + '<div class="file-icon">' + getFileIcon(f) + '</div>'
                    + '<div class="file-info">'
                    + '<div class="file-name" title="' + escapeAttr(name) + '">' + escapeHtml(name) + '</div>'
                    + '<div class="file-path" title="' + escapeAttr(f.relative_path) + '">' + escapeHtml(f.relative_path) + '</div>'
                    + '</div>'
                    + '<div class="file-meta">'
                    + '<span>' + f.file_size_fmt + '</span>'
                    + '<span>' + f.deletion_time_fmt + '</span>'
                    + '<span>' + f.ago_fmt + '</span>'
                    + '</div>'
                    + '<button class="btn btn-restore" onclick="restoreFile(\'' + escapeAttr(f.recycle_path) + '\', this)"'
                    + (f.exists ? '' : ' disabled') + '>'
                    + (f.exists ? '恢复' : '已清理')
                    + '</button>'
                    + '</div>';
            }
            container.innerHTML = html;
        }

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function escapeAttr(str) {
            return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ── 渲染分页控件 ──────────────────────────────────────
        function renderPagination(total, page, tp) {
            var paginationEl = document.getElementById('pagination');
            var infoEl = document.getElementById('paginationInfo');
            var controlsEl = document.getElementById('paginationControls');

            if (total === 0) {
                paginationEl.style.display = 'none';
                return;
            }
            paginationEl.style.display = 'flex';

            var start = (page - 1) * pageSize + 1;
            var end = Math.min(page * pageSize, total);
            infoEl.textContent = '显示 ' + start + '-' + end + ' 条，共 ' + total + ' 条';

            var html = '';
            // 上一页
            html += '<button class="page-btn" onclick="goToPage(' + (page - 1) + ')"' + (page <= 1 ? ' disabled' : '') + '>‹ 上一页</button>';

            // 页码按钮（最多显示 7 个页码，含省略号）
            var pages = buildPageNumbers(page, tp);
            for (var i = 0; i < pages.length; i++) {
                if (pages[i] === '...') {
                    html += '<span class="page-ellipsis">…</span>';
                } else {
                    html += '<button class="page-btn' + (pages[i] === page ? ' active' : '') + '" onclick="goToPage(' + pages[i] + ')">' + pages[i] + '</button>';
                }
            }

            // 下一页
            html += '<button class="page-btn" onclick="goToPage(' + (page + 1) + ')"' + (page >= tp ? ' disabled' : '') + '>下一页 ›</button>';

            controlsEl.innerHTML = html;
        }

        /**
         * 构建页码数组，例如: [1, '...', 4, 5, 6, 7, 8, '...', 20]
         * 始终显示首尾页、当前页前后2页
         */
        function buildPageNumbers(current, total) {
            if (total <= 7) {
                var arr = [];
                for (var i = 1; i <= total; i++) arr.push(i);
                return arr;
            }

            var pages = [];
            var left = Math.max(2, current - 2);
            var right = Math.min(total - 1, current + 2);

            pages.push(1);
            if (left > 2) pages.push('...');
            for (var j = left; j <= right; j++) pages.push(j);
            if (right < total - 1) pages.push('...');
            if (total > 1) pages.push(total);

            return pages;
        }

        function goToPage(page) {
            if (page < 1 || page > totalPages || page === currentPage) return;
            currentPage = page;
            loadFiles();
            // 滚动到列表顶部
            document.getElementById('fileList').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ── 恢复文件 ──────────────────────────────────────────
        function restoreFile(path, btn) {
            btn.disabled = true;
            btn.textContent = '恢复中...';

            fetch('/api/restore', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({path: path})
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.success) {
                    showToast('文件已恢复', 'success');
                    setTimeout(function() { loadFiles(); loadStats(); }, 500);
                } else {
                    showToast('恢复失败: ' + (data.error || '未知错误'), 'error');
                    btn.disabled = false;
                    btn.textContent = '恢复';
                }
            })
            .catch(function(err) {
                showToast('请求失败: ' + err, 'error');
                btn.disabled = false;
                btn.textContent = '恢复';
            });
        }

        // ── 清空回收站 ────────────────────────────────────────
        function emptyRecycle() {
            hideConfirm();
            fetch('/api/empty', {method: 'POST'})
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.success) {
                    showToast('回收站已清空', 'success');
                    currentPage = 1;
                    setTimeout(function() { loadFiles(); loadStats(); }, 500);
                } else {
                    showToast('清空失败', 'error');
                }
            });
        }

        // ── 加载统计 ──────────────────────────────────────────
        function loadStats() {
            fetch('/api/stats')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    document.getElementById('statCount').textContent = data.recycled_count;
                    document.getElementById('statSize').textContent = data.recycled_formatted;
                    document.getElementById('statBackup').textContent =
                        '备份: ' + data.backup_formatted + ' | 回收站: ' + data.recycle_formatted;
                });
        }

        // ── 刷新 ──────────────────────────────────────────────
        function refresh() {
            loadFiles();
            loadStats();
            var now = new Date();
            document.getElementById('lastRefresh').textContent =
                '上次刷新: ' + now.toLocaleTimeString('zh-CN');
        }

        // ── 事件绑定 ──────────────────────────────────────────
        // 搜索防抖
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(function() {
                currentPage = 1;
                loadFiles();
            }, 300);
        });

        // 每页条数切换
        document.getElementById('pageSizeSelect').addEventListener('change', function() {
            pageSize = parseInt(this.value);
            currentPage = 1;
            loadFiles();
        });

        // ── 初始化 ────────────────────────────────────────────
        loadFiles();
        loadStats();

        // 自动刷新时间显示
        setInterval(function() {
            var now = new Date();
            document.getElementById('lastRefresh').textContent =
                '上次刷新: ' + now.toLocaleTimeString('zh-CN');
        }, 60000);
    </script>
</body>
</html>
